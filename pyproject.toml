[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-runtime"
version = "0.1.0"
description = "Runtime for tool-using LLM agents: typed tool registry, validated calls, step and time limits, approval gates and replayable traces"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["agentrt"]
